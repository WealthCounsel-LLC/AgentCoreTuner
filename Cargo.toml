[package]
name = "agentcore-manager"
version = "0.1.0"
description = "Core library for AWS AgentCore Manager"
edition = "2021"

[lib]
name = "agentcore_manager"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"
dirs = "5"
git2 = "0.20.4"
keyring = { version = "3", features = ["apple-native"] }
open = "5"
rust-ini = "0.21"
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sso = "1"
aws-sdk-ssooidc = "1"
aws-sdk-sts = "1"

[dev-dependencies]
tempfile = "3.25.0"
